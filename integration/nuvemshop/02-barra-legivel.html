<!-- Acrescentar ao final do mesmo bloco da Grand Amour. -->
<script>
(function () {
  var host = document.getElementById('ga-nuvemshop-page');
  if (!host) return;

  function ajustarBarra() {
    var raiz = host.shadowRoot;
    if (!raiz) return;
    var estilo = raiz.getElementById('ga-barra-legivel');
    if (!estilo) {
      estilo = document.createElement('style');
      estilo.id = 'ga-barra-legivel';
      raiz.appendChild(estilo);
    }
    estilo.textContent = `
      .announcement {
        font-size: 14px !important;
        line-height: 1.5 !important;
        min-height: 44px;
        padding: 9px 20px;
        gap: 8px;
        text-align: center;
      }
      .announcement span { font-weight: 600; }
      .announcement svg {
        width: 14px;
        height: 14px;
        flex: 0 0 14px;
      }
      @media (max-width: 640px) {
        .announcement {
          font-size: 13px !important;
          min-height: 56px;
          padding: 8px 12px;
          flex-wrap: wrap;
          gap: 2px 6px;
          letter-spacing: 0.1px;
        }
        .announcement span {
          display: block !important;
          flex-basis: 100%;
        }
      }
    `;
  }

  ajustarBarra();
  host.addEventListener('ga:ready', ajustarBarra, { once: true });
})();
</script>
