<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="220 240 505 505" role="img" aria-label="Composição ilustrativa de cosméticos Aura Bloom em tons de rosa e lilás">
<defs>
<linearGradient id="bottle"><stop stop-color="#a675b6"/><stop offset=".12" stop-color="#ddbbd9"/><stop offset=".35" stop-color="#f9e8ef"/><stop offset=".7" stop-color="#ddbbd9"/><stop offset="1" stop-color="#a675b6"/></linearGradient>
<linearGradient id="glass"><stop stop-color="#f9dde7" stop-opacity=".75"/><stop offset=".18" stop-color="#fff7f7"/><stop offset=".5" stop-color="#edc3d2"/><stop offset=".86" stop-color="#d69fb6"/><stop offset="1" stop-color="#b881a2"/></linearGradient>
<linearGradient id="lid"><stop stop-color="#d6bbc3"/><stop offset=".15" stop-color="#fff8ef"/><stop offset=".4" stop-color="#e4ced1"/><stop offset=".62" stop-color="#fff7ee"/><stop offset="1" stop-color="#ba92a3"/></linearGradient>
<linearGradient id="white"><stop stop-color="#dcd0d7"/><stop offset=".18" stop-color="#fffaf9"/><stop offset=".55" stop-color="#fffdf9"/><stop offset="1" stop-color="#d2bccd"/></linearGradient>
<linearGradient id="plinth" x2="0" y2="1"><stop stop-color="#fff9f8"/><stop offset="1" stop-color="#dbb8cf"/></linearGradient>
<linearGradient id="petal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff4f2"/><stop offset=".5" stop-color="#f2c4d6"/><stop offset="1" stop-color="#c584a8"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#f3e3f4"/><stop offset="1" stop-color="#f3e3f4" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-60%" y="-40%" width="220%" height="200%"><feDropShadow dx="12" dy="18" stdDeviation="15" flood-color="#704268" flood-opacity=".19"/></filter>
<filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<ellipse cx="470" cy="470" rx="405" ry="360" fill="url(#glow)"/>
<g fill="none" stroke="#fff9fa" opacity=".6"><ellipse cx="465" cy="475" rx="370" ry="345" transform="rotate(-25 465 475)"/><ellipse cx="465" cy="475" rx="388" ry="360" transform="rotate(-25 465 475)"/></g>
